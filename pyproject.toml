[project]
name = "feedbackiq"
version = "0.1.0"
description = "FeedbackIQ - Intelligent review analysis pipeline"
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
  "fastapi>=0.116.0",
  "uvicorn>=0.35.0",
  "sqlalchemy>=2.0.39",
  "alembic>=1.16.4",
  "psycopg[binary]>=3.2.9",
  "pydantic>=2.11.0",
  "httpx>=0.28.1",
  "openai>=1.102.0",
  "tenacity>=9.1.2",
  "python-dateutil>=2.9.0.post0",
  "jinja2>=3.1.6",
  "reportlab>=4.4.3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4.0",
  "pytest-asyncio>=1.1.0",
  "ruff>=0.12.11",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
